name: Build Customer (Official OpenWrt Base)

# ==============================================================================
# 触发机制：基于官方原版 OpenWrt 源码 + Customer 模块化现代构建流 (workflow_dispatch)
# 核心优势：基于官方 OpenWrt 稳定基准，集成 -O3 编译压榨、Mold 极速链接、
#           Go 1.24+ 工具链与 HomeProxy/Nikki/MosDNS/PassWall 全套生态
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'OpenWrt 官方源码版本 Tag 或分支 (默认 v25.12.5)'
        required: true
        default: 'v25.12.5'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.5' }}
  TARGET: "rockchip"
  SUBTARGET: "armv8"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # 1. 检出当前仓库（包含 scripts/customer/ 脚本与 files/ 优化配置）
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并初始化编译工具链依赖
      - name: 清理磁盘空间与安装编译依赖
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs mold msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      # 3. 克隆 OpenWrt 官方原版源码 (upstream openwrt.git)
      - name: 克隆 OpenWrt 官方源码
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      # 4. 执行 Step 1：配置扩展 Feeds 软件源 (01-diy-feeds.sh)
      - name: 注入扩展 Feeds 源 (01-diy-feeds.sh)
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/customer/*.sh
          $GITHUB_WORKSPACE/scripts/customer/01-diy-feeds.sh

      # 5. 更新所有 Feeds 仓库索引
      - name: 更新 Feeds 仓库 (feeds update)
        run: |
          cd openwrt
          ./scripts/feeds update -a

      # 6. 执行 Step 2：工具链升级、冲突清理与独立插件拉取 (02-diy-packages.sh)
      - name: 工具链升级与软件包定制 (02-diy-packages.sh)
        run: |
          cd openwrt
          $GITHUB_WORKSPACE/scripts/customer/02-diy-packages.sh

      # 7. 安装所有 Feeds 组件索引
      - name: 安装 Feeds 索引 (feeds install)
        run: |
          cd openwrt
          ./scripts/feeds install -a -f
          ./scripts/feeds install -f -p passwall_packages sing-box v2ray-geodata
          ./scripts/feeds install -f -p mosdns mosdns luci-app-mosdns geo2txt
          ./scripts/feeds install -f -p nikki nikki luci-app-nikki mihomo-meta
          ./scripts/feeds install -f -p passwall luci-app-passwall

      # 8. 执行 Step 3：生成目标架构配置与依赖解析 (03-generate-config.sh)
      - name: 生成目标配置与展开依赖 (03-generate-config.sh)
        run: |
          cd openwrt
          $GITHUB_WORKSPACE/scripts/customer/03-generate-config.sh

      # 9. 预下载所有依赖源码包 (DL)
      - name: 预下载依赖包 (make download)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 10. 执行多核并行编译 (失败自动回退单核输出详细日志)
      - name: 编译固件 (make compile)
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      # 11. 整理生成文件并生成日期标签
      - name: 整理发布固件与生成日期标签
        run: |
          mkdir -p release_files
          cp openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*-sysupgrade.img.gz release_files/ || true
          cp openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*-squashfs-*.img.gz release_files/ || true
          cp openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums release_files/ || true

          TAG_DATE=$(date +'%Y.%m.%d')
          echo "RELEASE_TAG=OpenWrt-R3S-Customer-${TAG_DATE}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=OpenWrt (Customer) for NanoPi R3S (${TAG_DATE})" >> $GITHUB_ENV

      # 12. 上传固件至 Actions Artifacts
      - name: 上传构建固件到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: release_files/*

      # 13. 自动发布到 GitHub Releases
      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
