name: Build ImmortalWrt 25.12.2 for NanoPi R3S

# ==============================================================================
# 触发机制：支持在 GitHub 仓库 Actions 页面手动一键点击构建 (workflow_dispatch)
# ==============================================================================
on:
  workflow_dispatch:

concurrency:
  group: r3s-imagebuilder-${{ github.ref }}
  cancel-in-progress: false

# ==============================================================================
# 全局环境变量配置
# ==============================================================================
env:
  VERSION: "25.12.2"                      # ImmortalWrt 固件版本（采用 apk 包管理器，Linux 6.12 内核）
  TARGET: "rockchip"                      # 目标 SoC 架构大类（Rockchip 瑞芯微系列）
  SUBTARGET: "armv8"                      # 目标子架构（64 位 ARMv8）
  PROFILE: "friendlyarm_nanopi-r3s"       # 官方设备唯一标识符（NanoPi R3S / R3S LTS 专属 Profile）
  ROOTFS_PARTSIZE: "4096"                 # 根分区大小：直接分配 4096MB (4GB)
  TZ: Asia/Shanghai

  # ----------------------------------------------------------------------------
  # 增量软件包列表：精选 1GB 内存最优解，集成 Argon 主题、HomeProxy+sing-box 与底层优化驱动
  # 基础底层依赖（base-files、firewall4 等）ImageBuilder 会自动包含，此处只需声明增量插件
  # ----------------------------------------------------------------------------
  PACKAGES: >-
    luci luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn
    luci-app-homeproxy sing-box zram-swap kmod-tcp-bbr kmod-r8169 r8169-firmware
    kmod-gpio-button-hotplug kmod-nft-offload kmod-nft-tproxy luci-app-cpufreq
    luci-app-nlbwmon luci-i18n-base-zh-cn luci-i18n-cpufreq-zh-cn
    luci-i18n-homeproxy-zh-cn luci-i18n-nlbwmon-zh-cn htop curl fdisk e2fsprogs
    partx-utils zstd autocore default-settings-chn fwtool jsonfilter

# ==============================================================================
# 构建任务定义
# ==============================================================================
jobs:
  build:
    runs-on: ubuntu-22.04
    # 授予工作流写入权限，以便 softprops/action-gh-release 能够自动创建 Release 并上传产物
    permissions:
      contents: write

    steps:
      # 1. 检出当前仓库中的代码与 files/ 优化配置文件
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      # 2. 安装解压依赖并下载官方预编译好的 ImageBuilder 镜像生成器
      - name: 准备依赖并下载 ImageBuilder
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget zstd

          # 先核对同一官方目录的 SHA256，再解压 ImageBuilder。
          IB_BASE="https://downloads.immortalwrt.org/releases/$VERSION/targets/$TARGET/$SUBTARGET"
          IB_ARCHIVE="immortalwrt-imagebuilder-$VERSION-$TARGET-$SUBTARGET.Linux-x86_64.tar.zst"
          IB_URL="$IB_BASE/$IB_ARCHIVE"
          wget -q "$IB_URL" -O "$IB_ARCHIVE"
          wget -q "$IB_BASE/sha256sums" -O imagebuilder-official-sha256sums
          awk -v filename="$IB_ARCHIVE" '$2 == filename || $2 == "*" filename {print; found++} END {if (found != 1) exit 1}' \
            imagebuilder-official-sha256sums > imagebuilder.sha256
          sha256sum --check --strict imagebuilder.sha256
          tar -I zstd -xf "$IB_ARCHIVE"
          mv "${IB_ARCHIVE%.tar.zst}" ib
          # ImageBuilder 不会重新生成官方构建记录；另存并校验其基准信息。
          mkdir -p imagebuilder-buildinfo
          for metadata in config.buildinfo feeds.buildinfo version.buildinfo; do
            wget -q "$IB_BASE/$metadata" -O "imagebuilder-buildinfo/$metadata"
            awk -v filename="$metadata" '$2 == filename || $2 == "*" filename {print; found++} END {if (found != 1) exit 1}' \
              imagebuilder-official-sha256sums >> imagebuilder-buildinfo/sha256sums
          done
          (cd imagebuilder-buildinfo && sha256sum --check --strict sha256sums)
          echo "IB_URL=$IB_URL" >> "$GITHUB_ENV"

      # 3. 注入仓库中的 files 目录，并组装固件
      - name: 执行 ImageBuilder 固件打包 (含 files 优化注入)
        run: |
          cd ib
          # 核心打包命令：组装指定设备、增量软件包、指定根分区大小及自定义配置目录
          make image PROFILE="$PROFILE" \
                     PACKAGES="$PACKAGES" \
                     ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
                     FILES="$GITHUB_WORKSPACE/files"

      # 4. 按路线及运行编号命名，保存配置、包清单和来源信息
      - name: 整理发布固件与构建记录
        env:
          BUILD_DIR: ib
          RELEASE_ROUTE: ImageBuilder
          RELEASE_VERSION: ${{ env.VERSION }}
        run: |
          bash scripts/build/collect-release.sh

      # 5. 上传固件至 GitHub Actions Artifacts（构建产物备份）
      - name: 上传构建固件到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: release_files/*
          if-no-files-found: error

      # 6. 自动发布到 GitHub Releases
      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
