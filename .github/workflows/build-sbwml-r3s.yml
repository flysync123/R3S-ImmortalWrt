name: Build ImmortalWrt (sbwml-style Modular Build)

# ==============================================================================
# 触发机制：基于 sbwml/builder 模块化脚本架构的全源码构建工作流 (workflow_dispatch)
# 架构特色：将 Feeds 准备、包微调、.config 硬件配置解耦为独立脚本 (位于 scripts/ 目录)
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt 源码分支'
        required: true
        default: 'openwrt-25.12'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'openwrt-25.12' }}
  TARGET: "rockchip"
  SUBTARGET: "armv8"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # 1. 检出当前仓库（包含 scripts/ 脚本与 files/ 优化配置）
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并初始化编译工具链依赖
      - name: 清理磁盘空间与安装编译依赖
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      # 3. 克隆 ImmortalWrt 源码
      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      # 4. 执行 Step 1 脚本：配置 Feeds 源
      - name: 执行 scripts/01-prepare-feeds.sh
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/*.sh
          $GITHUB_WORKSPACE/scripts/01-prepare-feeds.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 执行 Step 2 脚本：微调软件包与注入 files/ 优化层
      - name: 执行 scripts/02-prepare-package.sh
        run: |
          cd openwrt
          $GITHUB_WORKSPACE/scripts/02-prepare-package.sh

      # 6. 执行 Step 3 脚本：生成 .config 并展开依赖
      - name: 执行 scripts/03-custom-config.sh
        run: |
          cd openwrt
          $GITHUB_WORKSPACE/scripts/03-custom-config.sh

      # 7. 预下载所有依赖源码包 (DL)
      - name: 预下载依赖包 (make download)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 8. 执行多核并行编译
      - name: 编译固件 (make compile)
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      # 9. 整理生成文件并生成日期标签
      - name: 整理发布固件与生成日期标签
        run: |
          mkdir -p release_files
          cp openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*-sysupgrade.img.gz release_files/ || true
          cp openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*-squashfs-*.img.gz release_files/ || true
          cp openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums release_files/ || true

          TAG_DATE=$(date +'%Y.%m.%d')
          echo "RELEASE_TAG=ImmortalWrt-R3S-sbwml-${TAG_DATE}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=ImmortalWrt (sbwml-style) for NanoPi R3S (${TAG_DATE})" >> $GITHUB_ENV

      # 10. 上传固件至 Actions Artifacts
      - name: 上传构建固件到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: release_files/*

      # 11. 自动发布到 GitHub Releases
      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
