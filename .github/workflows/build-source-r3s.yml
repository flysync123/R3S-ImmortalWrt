name: Build ImmortalWrt from Source (Full Build)

# ==============================================================================
# 触发机制：在 GitHub Actions 页面手动一键点击触发全源码编译 (workflow_dispatch)
# 全源码交叉编译包含内核与所有软件包，耗时取决于运行环境和上游源码。
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt 版本标签 v25.12.2（默认），或系列分支 openwrt-25.12'
        required: true
        default: 'v25.12.2'
        type: string

concurrency:
  group: r3s-source-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.2' }}
  TARGET: "rockchip"
  SUBTARGET: "armv8"
  PROFILE: "friendlyarm_nanopi-r3s"
  ROOTFS_PARTSIZE: "4096"
  TZ: Asia/Shanghai
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # 1. 检出当前仓库中的代码与 files/ 优化配置文件
      - name: Checkout 仓库文件
        uses: actions/checkout@v5

      # 在安装依赖之前检查引用；兼容 25.12.2 / openwrt-25.12.2 的版本输入。
      - name: 校验并规范化上游版本
        run: |
          resolved=$(bash scripts/build/resolve-ref.sh "$REPO_URL" "$REPO_BRANCH")
          echo "REPO_BRANCH=$resolved" >> "$GITHUB_ENV"
          echo "构建上游引用: $resolved"

      # 2. 清理 GitHub Runner 虚拟机磁盘，释放 30GB+ 空间供源码全编译
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs mold msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

          # 复用足够的 Swap，否则创建专用文件；保留 Runner 原有交换空间。
          sudo bash "$GITHUB_WORKSPACE/scripts/build/prepare-swap.sh"

      # 3. 克隆 ImmortalWrt 官方源码
      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      # 4. 更新与安装所有 Feeds 软件包定义
      - name: 更新与安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 生成精简硬件与插件配置 (.config)
      - name: 生成目标配置 (.config)
        run: |
          cd openwrt
          [[ "$TARGET" =~ ^[a-z0-9_-]+$ && "$SUBTARGET" =~ ^[a-z0-9_-]+$ && "$PROFILE" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$ROOTFS_PARTSIZE" =~ ^[1-9][0-9]*$ ]]
          cat > .config <<EOF
          CONFIG_TARGET_${TARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${PROFILE}=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}
          CONFIG_DEVEL=y
          CONFIG_USE_MOLD=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_r8169-firmware=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-i18n-cpufreq-zh-cn=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_partx-utils=y
          CONFIG_PACKAGE_zstd=y
          CONFIG_PACKAGE_fwtool=y
          CONFIG_PACKAGE_jsonfilter=y
          CONFIG_PACKAGE_autocore=y
          CONFIG_PACKAGE_default-settings-chn=y
          CONFIG_PACKAGE_luci-app-openclash=n
          CONFIG_PACKAGE_docker=n
          CONFIG_PACKAGE_dockerd=n
          CONFIG_PACKAGE_irqbalance=n
          EOF
          sed -i 's/^[ \t]*//' .config
          cp .config .config.requested
          make defconfig
          bash "$GITHUB_WORKSPACE/scripts/build/check-config.sh" .config.requested .config

      # 6. 注入仓库中的 files 目录（BBR/关机按键/10.0.0.1开机自动配置）
      - name: 注入自定义 files 配置
        run: |
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p openwrt/files
            cp -rf "$GITHUB_WORKSPACE/files/." openwrt/files/
          fi

      # 7. 预下载依赖包 (DL)
      - name: 恢复下载源码缓存
        id: dl-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            openwrt/dl
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu22-r3s-source-dl-v1-${{ hashFiles('openwrt/.config', 'scripts/customer/00-dependencies.sh') }}-${{ github.run_id }}.${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu22-r3s-source-dl-v1-

      - name: 恢复C/C++ 与 Go 编译缓存
        id: compile-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu22-r3s-source-compile-v1-${{ hashFiles('openwrt/.config', 'scripts/customer/00-dependencies.sh') }}-${{ github.run_id }}.${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu22-r3s-source-compile-v1-

      - name: 预下载依赖源码包 (make download)
        id: download
        run: |
          cd openwrt
          make download -j8

      # 8. 编译固件 (多核优先，失败自动降级单核输出详细日志)
      - name: 编译固件 (make compile)
        id: compile
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/build/compile.sh"

      - name: 保存下载源码缓存
        if: ${{ !cancelled() && steps.download.outcome == 'success' && steps.dl-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            openwrt/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: 保存编译缓存
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') && steps.compile-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

      - name: 保留编译日志
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: source-build-logs-${{ github.run_id }}.${{ github.run_attempt }}
          path: openwrt/build-logs/*.log
          retention-days: 7
          if-no-files-found: warn

      # 9. 保存上游提交、最终配置与软件包清单，生成唯一发布标签
      - name: 整理发布固件与构建记录
        env:
          BUILD_DIR: openwrt
          RELEASE_ROUTE: Source
          RELEASE_VERSION: ${{ env.REPO_BRANCH }}
        run: |
          bash scripts/build/collect-release.sh

      # 10. 上传固件至 Actions Artifacts
      - name: 上传构建固件到 Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_TAG }}
          path: release_files/*
          if-no-files-found: error
          compression-level: 0

      # 11. 自动发布到 GitHub Releases
      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
