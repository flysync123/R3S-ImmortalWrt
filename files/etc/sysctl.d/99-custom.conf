# ==============================================================================
# NanoPi R3S LTS 专属内核网络与内存调优参数
# 路径：/etc/sysctl.d/99-custom.conf
# 针对硬件：RK3566 四核 A55 / 1GB LPDDR4X / 双千兆网口 / sing-box 代理
# ==============================================================================

# 1. 启用 TCP BBR 拥塞控制算法
# 作用：极大提升路由器本机发起的 sing-box 代理出站 TCP 连接速度，并在跨境弱网丢包环境下保持高速
net.ipv4.tcp_congestion_control = bbr

# 2. 扩大网络接收/发送套接字核心缓冲区至 7.5MB (7500000 字节)
# 作用：满足 quic-go 官方标准，为 Hysteria2 / TUIC 等 QUIC 类 UDP 协议提供充裕缓冲区，杜绝 UDP 丢包限速
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# 3. 最大并发连接跟踪数 (NAT 连接数上限设为 65536)
# 作用：支持多设备并发、BT/PT 下载及大并发代理流量，防止 conntrack 表满导致全网断连
net.netfilter.nf_conntrack_max = 65536

# 4. TCP 已建立连接保持时间缩短为 7200 秒 (2小时，默认通常为 5天/432000秒)
# 作用：快速回收失效的僵尸连接，释放紧凑的 1GB 内存资源
net.netfilter.nf_conntrack_tcp_timeout_established = 7200

# 5. TCP 握手队列深度 (SYN Backlog 队列扩充至 8192)
# 作用：防止在大并发连接突发或连接风暴时出现 SYN 丢包
net.ipv4.tcp_max_syn_backlog = 8192

# 6. 内存 Swap 换页激进程度设为 5 (默认 60)
# 作用：平时尽量使用物理内存，只有在物理内存真正耗尽、濒临 OOM 崩溃时才使用 zram-swap 压缩内存兜底
vm.swappiness = 5
