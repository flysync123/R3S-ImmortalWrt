# ==============================================================================
# NanoPi R3S / LTS 专属全栈性能与网络极限调优参数
# 路径：/etc/sysctl.d/99-custom.conf
# 针对硬件：Rockchip RK3566 (四核 Cortex-A55) / 1GB LPDDR4X / 32GB eMMC / 双千兆
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 拥塞控制与队列管理 (TCP BBR + 零 RTT Fast Open)
# ------------------------------------------------------------------------------
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq_pie
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# ------------------------------------------------------------------------------
# 2. 7.5MB 核心套接字缓冲 (完全满足 quic-go 标准，为 Hysteria2 / TUIC 提供极致吞吐)
# ------------------------------------------------------------------------------
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 87380 7500000
net.ipv4.tcp_wmem = 4096 65536 7500000
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# ------------------------------------------------------------------------------
# 3. 网卡驱动与软中断收发队列压榨 (消除千兆微突发丢包)
# ------------------------------------------------------------------------------
net.core.netdev_max_backlog = 16384
net.core.dev_weight = 64
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_max_tw_buckets = 65536

# ------------------------------------------------------------------------------
# 4. 连接跟踪表并发上限与超时快速回收 (释放紧凑 1GB 内存)
# ------------------------------------------------------------------------------
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# ------------------------------------------------------------------------------
# 5. 虚拟内存与 I/O 调度调优 (抗 OOM 护城河 & 抑制 eMMC 写入卡顿)
# ------------------------------------------------------------------------------
vm.swappiness = 5
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50
